# Entorno local de desarrollo: app + PostgreSQL (como se presentó en el Sprint 0)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expedientes
      POSTGRES_USER: judicial
      POSTGRES_PASSWORD: judicial-local
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judicial -d expedientes"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://judicial:judicial-local@db:5432/expedientes
      JWT_SECRET: solo-para-desarrollo-local
      SEED_DEMO: "1"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
