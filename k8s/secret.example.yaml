# OJO: esto es un ejemplo. Nunca subas secretos reales al repo.
# En CI se crea con: kubectl create secret generic app-secrets --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: expediente-judicial
type: Opaque
stringData:
  JWT_SECRET: "reemplazar-en-ci"
  POSTGRES_PASSWORD: "reemplazar-en-ci"
  DATABASE_URL: "postgresql+psycopg://judicial:reemplazar-en-ci@postgres:5432/expedientes"
